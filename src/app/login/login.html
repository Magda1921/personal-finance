<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-input
    [control]="form.controls['email']"
    type="text"
    placeholder="Email"
  />
  <app-input
    [control]="form.controls['password']"
    type="password"
    placeholder="Password"
  />
  <button type="submit">Login</button>
</form>
