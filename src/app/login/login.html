<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <label for="email">Email</label>
  <app-input [control]="form.controls.email" type="email" placeholder="Email" />
  <label for="password">Password</label>
  <app-input
    [control]="form.controls.password"
    type="password"
    placeholder="Password"
  />
  <button type="submit" [disabled]="sending || form.invalid">Login</button>
</form>
